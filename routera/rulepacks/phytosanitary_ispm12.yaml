# Ported from the team's governance module (github.com/kokilacg30/routera_compliance, rulepacks/).
# Fitted to ROUTERA: residue rules name the lab standard ROUTERA reads (pass/fail per lot) instead of
# blueberry limits; mango treatment and Malaysia permit rules added. Verify before relying on them.
pack_id: phytosanitary_ispm12
version: 1.0.0
scope:
  origin: '*'
  destination: '*'
  commodity_groups:
  - fresh_fruit
  - fresh_vegetables
  - plants
  modes:
  - sea
  - air
  - road
rules:
- rule_id: ISPM12-REQ-001
  title: International Phytosanitary Certificate Mandate
  type: required_document
  parameters:
    document: phytosanitary_certificate_application_data
    destination_specific: true
  effect_on_failure: needs_docs
  source:
    title: 'ISPM 12: Guidelines for Phytosanitary Certificates (IPPC)'
    url: https://www.ippc.int/en/publications/609/
    citation: ISPM 12 (2023 version) Section 1.3 'Requirements for issuing phytosanitary certificates'
  effective_date: '2023-05-01'
  last_verified: '2026-09-15'
  verification_status: verified
  notes: Mandates destination-specific phytosanitary certificate for plants and perishable plant produce.
- rule_id: ISPM12-TRACE-002
  title: Lot Traceability and Registered Production Site ID
  type: traceability_requirement
  parameters:
    required_keys:
    - orchard_code
    - packhouse_code
  effect_on_failure: needs_docs
  source:
    title: 'ISPM 12: Guidelines for Phytosanitary Certificates (IPPC)'
    url: https://www.ippc.int/en/publications/609/
    citation: ISPM 12 Appendix 1 'Information for identifying the consignment'
  effective_date: '2023-05-01'
  last_verified: '2026-09-15'
  verification_status: verified
  notes: Requires official producer/orchard and packhouse registration numbers.
